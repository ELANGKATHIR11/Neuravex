[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuravex"
version = "0.4.0"
description = "Neuravex: Hardened native edge perception & computer vision runtime engine"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.8"
authors = [
    {name = "ELANGKATHIR11"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0", "torchvision>=0.15.0"]
cv = ["opencv-python>=4.5.0", "Pillow>=8.0.0"]
coco = ["pycocotools>=2.0.0"]
tracking = ["scipy>=1.7.0"]
onnx = ["onnx>=1.12.0", "onnxruntime>=1.12.0"]
train = ["torch>=2.0.0", "torchvision>=0.15.0", "scipy>=1.7.0", "matplotlib>=3.5.0"]
full = [
    "torch>=2.0.0", "torchvision>=0.15.0",
    "opencv-python>=4.5.0", "Pillow>=8.0.0",
    "pycocotools>=2.0.0", "scipy>=1.7.0",
    "matplotlib>=3.5.0", "onnx>=1.12.0", "onnxruntime>=1.12.0", "psutil>=5.8.0",
]
dev = [
    "pytest>=7.0.0", "pytest-cov>=4.0.0",
]

[project.scripts]
neuravex = "neuravex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuravex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
